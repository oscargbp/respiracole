name: Previsión a 5 días (dos veces al día)

on:
  schedule:
    - cron: "40 5,15 * * *"   # por la mañana y por la tarde (hora UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vivo.txt
      - run: pip install -r requirements-vivo.txt
      - name: Previsión de AEMET y Copernicus
        run: python pronostico.py
      - name: Guardar la previsión
        run: |
          git config user.name "respiracole-bot"
          git config user.email "respiracole-bot@users.noreply.github.com"
          git add datos/pronostico.json demo/demo_pronostico.js docs/demo_pronostico.js
          git diff --cached --quiet || git commit -m "Previsión a 5 días"
          git pull --rebase
          git push
